services:
  # ============================================================================
  # CADDY WEB SERVER (HTTPS & REVERSE PROXY)
  # ============================================================================
  caddy:
    image: caddy:latest
    container_name: pizza-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - pizza-network

  # ============================================================================
  # POSTGRESQL DATABASE - NOW USING SUPABASE (REMOVED)
  # ============================================================================
  # PostgreSQL is now managed by Supabase cloud service
  # Connection details are configured in .env file:
  # - DB_URL, DB_USERNAME, DB_PASSWORD, DB_SCHEMA

  # ============================================================================
  # REDIS CACHE SERVICE
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: pizza-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pizza-network

  # ============================================================================
  # ELASTICSEARCH SERVICE
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: pizza-elasticsearch
    restart: unless-stopped
    environment:
      - cluster.name=pizza-cluster
      - node.name=pizza-node-1
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - bootstrap.memory_lock=true
      - indices.query.bool.max_clause_count=4096
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - pizza-network

  # ============================================================================
  # KIBANA SERVICE
  # ============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: pizza-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=pizza-kibana
      - SERVER_HOST=0.0.0.0
      - LOGGING_ROOT_LEVEL=info
      - I18N_LOCALE=en
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - pizza-network

  # ============================================================================
  # SPRING BOOT APPLICATION SERVICE
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizza-app
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9092:9092"
    environment:
      # ========== SPRING PROFILE ==========
      SPRING_PROFILES_ACTIVE: dev

      # ========== DATABASE - SUPABASE (Spring Boot Standard Naming) ==========
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # ========== REDIS (Spring Boot Standard Naming) ==========
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""

      # ========== ELASTICSEARCH (Spring Boot Standard Naming) ==========
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

      # ========== JWT ==========
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # ========== SUPABASE (Required for JwksService) ==========
      APP_SUPABASE_URL: ${SUPABASE_URL}
      APP_SUPABASE_ENABLED: "true"

      # ========== APPLICATION URLS ==========
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost:3000/oauth2/callback}

      # ========== CLOUDINARY (Spring Boot Relaxed Binding) ==========
      CLOUDINARY_CLOUD_NAME: ${CLOUD_NAME}
      CLOUDINARY_API_KEY: ${API_KEY}
      CLOUDINARY_API_SECRET: ${API_SECRET}

      # ========== MAIL (Spring Boot Standard Naming) ==========
      # Natro SMTP Configuration (Port 587 with STARTTLS)
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST: ${MAIL_SMTP_SSL_TRUST:-*}
      SPRING_MAIL_PROPERTIES_MAIL_DEBUG: ${MAIL_DEBUG:-false}

      # ========== IYZICO PAYMENT ==========
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL:-https://api.burakaltiparmak.site/pizza/api/payment/3ds/callback}

      # ========== CORS ==========
      CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      # ========== SERVER ==========
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /pizza

      # ========== JVM OPTIONS ==========
      JAVA_OPTS: "-Xmx512m -Xms256m"

    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/pizza/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - pizza-network
    volumes:
      - app_logs:/app/logs

  # ============================================================================
  # MONITORING STACK
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: pizza-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - pizza-network
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: pizza-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - pizza-network
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: pizza-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - pizza-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: pizza-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - pizza-network

  loki:
    image: grafana/loki:latest
    container_name: pizza-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - pizza-network
    depends_on:
      - app

  promtail:
    image: grafana/promtail:latest
    container_name: pizza-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - pizza-network
    depends_on:
      - loki

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  pizza-network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  app_logs:
    driver: local
  caddy_data:
  caddy_config:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
