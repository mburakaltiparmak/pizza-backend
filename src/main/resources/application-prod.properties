# ============================================================================
# APPLICATION-PROD.PROPERTIES - PRODUCTION ENVIRONMENT
# ============================================================================
# DATABASE CONFIGURATION - SUPABASE (PRODUCTION)
# ============================================================================
# Using Supabase managed PostgreSQL (cloud database)
# Spring Boot will automatically bind SPRING_DATASOURCE_URL → spring.datasource.url
# Set these environment variables in Docker Compose or deployment platform
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.nslkxjzddnjpouzkevii.supabase.co:5432/postgres?currentSchema=pizza}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.nslkxjzddnjpouzkevii}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=pizza
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool (HikariCP) - Production settings for Supabase
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================================================
# REDIS CONFIGURATION - PROD
# ============================================================================
# Spring Boot will automatically bind SPRING_DATA_REDIS_HOST → spring.data.redis.host
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.data.redis.database=0
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Redis Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=prod:

# ============================================================================
# JWT CONFIGURATION - PROD (Phase 4.4: Access & Refresh Token Separation)
# ============================================================================
jwt.secret=${JWT_SECRET}

# LEGACY: Kept for backward compatibility (deprecated methods use this)
jwt.expiration=86400000

# PHASE 4.4 NEW: Access Token (short-lived for API authentication)
# Duration: 30 minutes = 1800000ms (recommended for production security)
# Used by: UnifiedTokenProvider.generateAccessToken()
jwt.access-token.expiration=1800000

# PHASE 4.4 NEW: Refresh Token (long-lived, stored in database via RefreshTokenService)
# Duration: 7 days = 604800000ms (balance between security and UX)
# Used by: RefreshTokenServiceImpl
# Note: Can increase to 30 days (2592000000ms) if needed for better UX
jwt.refresh-token.expiration=604800000

# ============================================================================
# CLOUDINARY CONFIGURATION - PROD
# ============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================================================
# EMAIL CONFIGURATION - PROD (Natro SMTP - Port 587 NO ENCRYPTION)
# ============================================================================
# Natro explicitly recommends "No Encryption" for port 587
# This means NO SSL and NO STARTTLS - plain SMTP with authentication only
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}

# Explicitly disable ALL encryption
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.required=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Use plain socket factory (no SSL)
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.SocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=true
spring.mail.properties.mail.smtp.socketFactory.port=587

# Email Async Configuration
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============================================================================
# CORS CONFIGURATION - PROD (Strict)
# ============================================================================
# Custom property for CorsConfig.java
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.mvc.cors.max-age=3600

# ============================================================================
# SUPABASE CONFIGURATION - PROD (Required for JwksService)
# ============================================================================
app.supabase.url=${APP_SUPABASE_URL:}
app.supabase.enabled=${APP_SUPABASE_ENABLED:true}

# ============================================================================
# LOGGING CONFIGURATION - PROD (Minimal)
# ============================================================================
logging.level.root=WARN
logging.level.com.example.pizza=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.mail=DEBUG
logging.level.com.example.pizza.service.logic.EmailService=DEBUG

# Log to file
logging.file.name=${LOG_FILE_PATH:/app/logs/application.log}
logging.file.max-size=10MB
logging.file.max-history=30

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# ACTUATOR CONFIGURATION - PROD (Restricted for Security)
# ============================================================================
# Only expose health and info endpoints in production
# Metrics and Prometheus should be accessed via internal monitoring tools only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.info.enabled=true

# Disable sensitive endpoints in production
management.endpoint.metrics.enabled=false
management.endpoint.prometheus.enabled=false

# Security for actuator
management.endpoints.web.base-path=/actuator
management.security.enabled=true

# ============================================================================
# MULTIPART FILE UPLOAD - PROD
# ============================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true

# ============================================================================
# ASYNC CONFIGURATION - PROD
# ============================================================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=prod-async-

# ============================================================================
# SERVER CONFIGURATION - PROD
# ============================================================================
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ============================================================================
# SECURITY HEADERS - PROD
# ============================================================================
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ============================================================================
# PRODUCTION MODE FLAGS
# ============================================================================
app.environment=production
app.dev-mode=false
app.using-test-data=false
app.database.schema=public

# Application URLs (required by EmailService)
app.base-url=${APP_BASE_URL:https://api.burakaltiparmak.site/pizza}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}

# ============================================================================
# RATE LIMITING - PROD (Strict)
# ============================================================================
bucket4j.enabled=true
bucket4j.filters[0].cache-name=rate-limit-buckets-prod
bucket4j.filters[0].url=.*
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=100
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes

# ============================================================================
# SSL/TLS CONFIGURATION (If needed)
# ============================================================================
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEY_STORE}
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12

# ============================================================================
# SPRINGDOC OPENAPI - SWAGGER UI (PRODUCTION)
# ============================================================================
# Disabled by default in production for security
# Enable with SWAGGER_ENABLED=true environment variable if needed
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.show-actuator=false

# ============================================================================
# PROMETHEUS METRICS (PRODUCTION - Internal Access Only)
# ============================================================================
# Note: Prometheus endpoint disabled in actuator config above
# Access metrics through internal monitoring infrastructure
management.metrics.export.prometheus.enabled=false
management.metrics.tags.application=pizza-backend